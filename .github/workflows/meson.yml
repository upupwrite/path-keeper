name: Meson Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write   # 用于创建 Release

jobs:
  # ---------- 构建与测试（非 tag 触发） ----------
  build:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [release]
        c_compiler: [gcc, clang]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libjsoncpp-dev libreadline-dev \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            pkg-config python3-pytest meson ninja-build

      - name: Configure Meson
        run: |
          CC=${{ matrix.c_compiler }} CXX=${{ matrix.cpp_compiler }} \
            meson setup build \
              --buildtype=${{ matrix.build_type }} \
              -Dbuild_tests=true

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

  # ---------- 构建 Debian 包 ----------
  build-deb:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libjsoncpp-dev libreadline-dev \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            pkg-config python3-pytest meson ninja-build \
            dpkg-dev

      - name: Configure & build
        run: |
          meson setup build \
            --buildtype=release \
            --prefix=/usr \
            -Dbuild_tests=true
          meson compile -C build
          meson test -C build --print-errorlogs

      - name: Extract project version
        id: version
        run: |
          VERSION=$(grep -m1 "version:" meson.build \
            | sed -E "s/.*version:[[:space:]]*'([0-9.]+)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Stage install
        run: DESTDIR="$PWD/pkgdir" meson install -C build

      - name: Compute runtime dependencies
        id: shlibs
        run: |
          # 等价于 CPACK_DEBIAN_PACKAGE_SHLIBDEPS ON
          DEPS=$(dpkg-shlibdeps -O pkgdir/usr/bin/pk 2>/dev/null \
                 | sed -n 's/^shlibs:Depends=//p')
          # 兜底：若 shlibdeps 没输出（例如运行环境异常），给出常见依赖
          [ -z "$DEPS" ] && DEPS="libjsoncpp25, libqt6core6, libreadline8"
          echo "deps=$DEPS" >> "$GITHUB_OUTPUT"
          echo "Runtime deps: $DEPS"

      - name: Build DEB package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DEPS="${{ steps.shlibs.outputs.deps }}"
          mkdir -p pkgdir/DEBIAN
          cat > pkgdir/DEBIAN/control <<EOF
          Package: path-keeper
          Version: $VERSION
          Architecture: amd64
          Maintainer: upupwrite <upupwrite@outlook.com>
          Section: utils
          Priority: optional
          Depends: $DEPS
          Description: P(ath) K(eeper) Command-Line Tool
           A Multi-Functional Command-Line Utility.
          EOF
          dpkg-deb --build --root-owner-group pkgdir \
            "path-keeper_${VERSION}_amd64.deb"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: '*.deb'

  # ---------- 构建 Arch Linux 包 ----------
  build-arch:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Arch)
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel meson ninja qt6-base qt6-tools \
            jsoncpp readline pkgconf python-pytest git

      - name: Build with Meson
        run: |
          meson setup build \
            --buildtype=release \
            --prefix=/usr \
            -Dbuild_tests=true
          meson compile -C build
          meson test -C build --print-errorlogs

      - name: Create Arch package
        run: |
          VERSION=$(grep -m1 "version:" meson.build \
            | sed -E "s/.*version:[[:space:]]*'([0-9.]+)'.*/\1/")
          [ -z "$VERSION" ] && VERSION="0.0.0"
          PKGNAME="path-keeper"

          mkdir -p pkgdir
          DESTDIR="$PWD/pkgdir" meson install -C build

          cat > pkgdir/.PKGINFO <<EOF
          pkgname = $PKGNAME
          pkgver = $VERSION-1
          pkgdesc = "P(ath) K(eeper) Command-Line Tool"
          arch = x86_64
          size = $(du -sb pkgdir | cut -f1)
          depend = qt6-base
          depend = jsoncpp
          depend = readline
          EOF

          cd pkgdir
          bsdtar -czf "../$PKGNAME-$VERSION-1-x86_64.pkg.tar.zst" .PKGINFO *
          cd ..

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: '*.pkg.tar.zst'

  # ---------- 发布到 GitHub Release ----------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-deb, build-arch]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files (debug)
        run: find artifacts -type f

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/deb-package/*.deb
            artifacts/arch-package/*.pkg.tar.zst
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
